# vim:ft=kitty
## name: nvim_light
## blurb: Neovim's default colorscheme (background=light), from the NvimDark*/NvimLight* palette
## Normal = NvimDarkGrey2 on NvimLightGrey2, accents are the NvimDark* colors

foreground                      #14161b
background                      #e0e2ea
# Visual: NvimLightGrey4 background, text keeps its color
selection_foreground            none
selection_background            #9b9ea4

# Cursor: reverse of Normal
cursor                          #14161b
cursor_text_color               #e0e2ea

url_color                       #007373

# borders: StatusLine / NonText
active_border_color             #4f5258
inactive_border_color           #9b9ea4

# tab bar: TabLineSel (StatusLine) / TabLine (StatusLineNC)
tab_bar_background              #c4c6cd
active_tab_foreground           #14161b
active_tab_background           #9b9ea4
inactive_tab_foreground         #2c2e33
inactive_tab_background         #c4c6cd

# black: NvimDarkGrey1 / bright black like Comment (NvimDarkGrey4)
color0  #07080d
color8  #4f5258
# red
color1  #590008
color9  #590008
# green
color2  #005523
color10 #005523
# yellow
color3  #6b5300
color11 #6b5300
# blue
color4  #004c73
color12 #004c73
# magenta
color5  #470045
color13 #470045
# cyan
color6  #007373
color14 #007373
# white: NvimLightGrey3 / NvimLightGrey1
color7  #c4c6cd
color15 #eef1f8

env THEME_IS_LIGHT=1
