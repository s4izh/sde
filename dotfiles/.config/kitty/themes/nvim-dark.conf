# vim:ft=kitty
## name: nvim_dark
## blurb: Neovim's default colorscheme (background=dark), from the NvimDark*/NvimLight* palette
## Normal = NvimLightGrey2 on NvimDarkGrey2, accents are the NvimLight* colors

foreground                      #e0e2ea
background                      #14161b
# Visual: NvimDarkGrey4 background, text keeps its color
selection_foreground            none
selection_background            #4f5258

# Cursor: reverse of Normal
cursor                          #e0e2ea
cursor_text_color               #14161b

url_color                       #8cf8f7

# borders: StatusLine / NonText
active_border_color             #9b9ea4
inactive_border_color           #4f5258

# tab bar: TabLineSel (StatusLine) / TabLine (StatusLineNC)
tab_bar_background              #2c2e33
active_tab_foreground           #e0e2ea
active_tab_background           #4f5258
inactive_tab_foreground         #c4c6cd
inactive_tab_background         #2c2e33

# black: NvimDarkGrey1 / bright black like Comment (NvimLightGrey4)
color0  #07080d
color8  #9b9ea4
# red
color1  #ffc0b9
color9  #ffc0b9
# green
color2  #b3f6c0
color10 #b3f6c0
# yellow
color3  #fce094
color11 #fce094
# blue
color4  #a6dbff
color12 #a6dbff
# magenta
color5  #ffcaff
color13 #ffcaff
# cyan
color6  #8cf8f7
color14 #8cf8f7
# white: NvimLightGrey3 / NvimLightGrey1
color7  #c4c6cd
color15 #eef1f8
